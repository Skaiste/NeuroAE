default:
  data:
    data:
      type: ADNI3
      parcelations: 400
      batch_size: 32
      cache_file: data/ADNI_preprocessed_cache_400.pt
      cache_mode: load
      fc_input: false
      flatten: false
      normalize: true
      pad_features: false
      preserve_timepoints: false
      random_seed: 42
      timepoints_as_samples: false
      transpose: false
      truncate_features: false
      train_split: 0.8
      val_split: 0.0
      heldout_subject_target: test
      heldout_subject_ids: [009_S_0751, 011_S_4278, 012_S_6073, 018_S_4400, 019_S_6668, 027_S_6001, 027_S_6034, 027_S_6327, 027_S_6640, 027_S_6788, 035_S_4114, 035_S_4785, 041_S_4513, 041_S_5253, 099_S_4076, 099_S_6632, 126_S_6724, 127_S_6173, 127_S_6330, 129_S_6852, 135_S_6411, 141_S_6061]
  model:
    freeze_encoder: false
    reset_decoder: false
  training:
    num_epochs: 1000
    save_dir: ./models
    checkpoint_selection_metric: swfcd_loss_joint
    evaluation_scope: per_group
    vectorize_val_reference: false
    compute_swfcd_during_training: true
    learning_rate: 1e-3
    weight_decay: 1e-4
    loss_params:
      pred_heads_delta: 1
      loss_per_feature: true
      swfcd_beta: 0
      swfcd_window: 30
      swfcd_step: 3
    convergence_patience: 10
    convergence_min_delta: 1e-4
    convergence_warmup_epochs: 10
    reproducibility:
      benchmark: false
      deterministic: true
      enabled: true
      seed: 42
      warn_only: false


LAE:
  static_params:
    model:
      name: LAE
      latent_dim: 32
    training:
      loss_params:
        beta: 0
  exp_params:
    training:
      reproducibility:
        seed: [42, 100, 1, 111, 1007, 751, 149, 1216, 67, 1717]
  
